<!DOCTYPE html>
<html>
<script type="module" src="dest/App.js" defer></script>
<script type="module" src="dest/mouse-tracking.js" defer></script>
<script type="module" src="dest/Settings.js" defer></script>
<link rel="stylesheet" href="src/App.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<body>
    
    <div class="round-finalization">
        <p id="score-display"></p>
        <p id="score-breakdown"></p>
        <button id="next-round-button">Next</button>
    </div>
    
    <!-- <div id="settings-gear">⚙</div> -->
    <i id="settings-gear" class="fa fa-gear" style="font-size:36px"></i>

    <dialog id="mark-skin-dialog">
        <h2>Choose Mark Skin</h2>
        <div class="mark-skin-grid">
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Place_Mark.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Fire.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Ice.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Storm.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Life.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Myth.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Death.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Balance.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Sun.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Moon.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Star.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Shadow.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Hat.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Mouth_Options_Male.png" />
            <img class="mark-skin-option" src="./Images/Markers/(Icon)_Mouth_Options_Female.png" />
        </div>
        <button id="mark-skin-dialog-close-button">Close</button>
    </dialog>

    <dialog id="settings-dialog">
        <h2 id="settings-dialog-title">Settings</h2>
        
        <img id="mark-skin-button" src="./Images/Markers/(Icon)_Place_Mark.png" />

        <div class="slidecontainer">
            <label for="zoom-slider">Scroll Zoom Speed</label>
            <!-- TODO: Create reset button -->
            <input id="zoom-slider" type="range" min="0.01" max="0.2" value="0.05" step="0.01" class="slider">
        </div>

        <!-- reference this reddit thread for world name abbreviations
            https://www.reddit.com/r/Wizard101/s/DvCPhFq3Jq
        -->
        <details id="arc-selection" class="settings-selection">
            <summary>Included Arcs</summary>
            <div class="arc-options">
                <details>
                    <summary>
                        <label><input type="checkbox" id="arc1-checkbox" data-arc="Arc 1" checked /> Arc 1 (Wizard City - Dragonspyre)</label>
                    </summary>
                    <div class="arc-options">
                        <label><input type="checkbox" data-world="wizard-city" checked /> Wizard City </label>
                        <label><input type="checkbox" data-world="krokotopia" checked /> Krokotopia </label>
                        <label><input type="checkbox" data-world="marleybone" checked /> Marleybone </label>
                        <label><input type="checkbox" data-world="mooshu" checked /> Mooshu </label>
                        <label><input type="checkbox" data-world="dragonspyre" checked /> Dragonspyre </label>
                    </div>
                </details>
                <details>
                    <summary>
                        <label><input type="checkbox" id="arc2-checkbox" data-arc="Arc 2" checked /> Arc 2 (Celestia - Khrysalis)</label>
                    </summary>
                    <div class="arc-options">
                        <label><input type="checkbox" data-world="celestia" checked /> Celestia </label>
                        <label><input type="checkbox" data-world="zafaria" checked /> Zafaria </label>
                        <label><input type="checkbox" data-world="avalon" checked /> Avalon </label>
                        <label><input type="checkbox" data-world="azteca" checked /> Azteca </label>
                        <label><input type="checkbox" data-world="khrysalis" checked /> Khrysalis </label>
                    </div>
                </details>
                <details>
                    <summary>
                        <label class="arc-disabled"><input type="checkbox" id="Arc 3" data-arc="arc3-checkbox" disabled /> Arc 3 (Polaris - Empyrea)</label>
                    </summary>
                    <div class="arc-options">
                        <label><input class="arc-disabled" type="checkbox" data-world="polaris" disabled /> Polaris </label>
                        <label><input class="arc-disabled" type="checkbox" data-world="mirage" disabled /> Mirage </label>
                        <label><input class="arc-disabled" type="checkbox" data-world="empyrea" disabled /> Empyrea </label>
                    </div>
                </details>
                <details>
                    <summary>
                        <label><input type="checkbox" id="sidearc-checkbox" data-arc="Side Arc" checked /> Side Arc (Grizzleheim, Wysteria)</label>
                    </summary>
                    <div class="arc-options">
                        <label><input type="checkbox" data-world="grizzleheim" checked /> Grizzleheim </label>
                        <label><input type="checkbox" data-world="wysteria" checked /> Wysteria </label>
                    </div>
                </details>
            </div>
        </details>

        <button type="submit" id="arc-select-submit-button">Update Settings</button>

        <button id="settings-close-button">Close</button>
    </dialog>

    <!-- <h1 id="title">Wizard101 GeoGuessr</h1> -->
    <img id="guess-image" src="" />

    <p id="img-difficulty"></p>
    <div class="difficulty-bar">
        <div class="difficulty-bar-fill"></div>
    </div>

    <div id="Wizard101GeoGuessrMap">
        <!-- <button id="debug-boarder-button">Debug World</button> -->
        <div id="Spiral"></div>
        <button id="submit-guess-button">Place your Mark!</button>
    </div>




</body>

</html>
